<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PVS Test</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="half">
        <label>Category/Analysis:</label> <select id="layersSelect"></select>
        <label>Mode:</label> 
        <select id="modesSelect" multiple>
         	<option value="walk">walk</option>
  			<option value="bike">bike</option>
  			<option value="eBike">eBike</option>
  			<option value="publicTransport">publicTransport</option>
        </select>
        <label>Search-radius (m):</label><input type="number" id="radius_meters" name="radius_meters" min="10" max="30000" />
        <div id="mapId" class="map"></div>
      </div>
      <div class="half">
        <h4>Details</h4>
        <div id="chartdiv1" class="chartdiv"></div>
        <div id="details"></div>
        <p>Anleitung:</p>
        <ul>
        <li>Klick auf Poi: Details und Routing</li>
        <li>Klick daneben: Diagramm (wenn in Standort-Modus)</li>
        <li>Rechtklick: Startpunkt neu setzen</li>
        </ul>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
