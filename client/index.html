<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PVS Test</title>
</head>
<body>
	<div class="wrapper">
		<div class="left_pane">
			<div class="settings">
				<div>
					<label>Category/Analysis:</label> <select id="layersSelect"></select>
				</div>
				<div>
					<label>Mode:</label> <select id="modesSelect" multiple>
						<option value="walk" selected>walk</option>
						<option value="bike" selected>bike</option>
						<option value="eBike" selected>eBike</option>
						<option value="publicTransport" selected>publicTransport</option>
					</select>
				</div>
				<div>
					<label>Time Filter:</label> <select id="timeFilterSelect" multiple>
						<option value="standard" selected>standard</option>
						<option value="more">more</option>
						<option value="all">all</option>
					</select>
				</div>
				<div>
					<label>Text Filter:</label><input type="text" id="text_filter"
						name="text_filter" />
				</div>
				<div>
					<label>Search-radius (m):</label><input type="number"
						id="radius_meters" name="radius_meters" min="10" max="30000" />
				</div>
			</div>
			<div id="mapId" class="map"></div>
		</div>
		<div class="right_pane">
			<h4>Details</h4>
			<div id="chartdiv1" class="chartdiv"></div>
			<div id="details"></div>
			<p>Anleitung:</p>
			<ul>
				<li>Klick auf Poi: Details und Routing</li>
				<li>Klick daneben: Diagramm (wenn in Standort-Modus)</li>
				<li>Rechtklick: Startpunkt neu setzen</li>
			</ul>
		</div>
	</div>
	<script type="module" src="./main.js"></script>
</body>
</html>
